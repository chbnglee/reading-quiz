<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Nunito:wght@700;800;900&family=ABeeZee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/studio.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">BookeyTalkey</div>
    <h1>Quiz Studio</h1>
  </div>
  <div class="top-actions">
    <button class="ghost-btn" id="load-sample-btn">OG0021 샘플</button>
    <label class="ghost-btn file-label">
      JSON 불러오기
      <input type="file" id="json-file" accept=".json,application/json">
    </label>
  </div>
</header>

<main class="studio-grid">
  <aside class="panel input-panel">
    <section class="batch-box">
      <div class="panel-head compact">
        <h2>Story Batch</h2>
        <span class="pill" id="batch-count">0 stories</span>
      </div>
      <div class="mini-actions">
        <button class="icon-btn" id="batch-template-btn" title="Download batch template">📄 <span>Format</span></button>
        <label class="icon-btn file-label centered" title="Load batch XLSX or JSON">
          📂 <span>Load</span>
          <input type="file" id="batch-file" accept=".xlsx,.xls,.csv,.json,application/json">
        </label>
        <label class="icon-btn file-label centered" title="Load image/audio folders for preview">
          🖼️ <span>Assets</span>
          <input type="file" id="asset-folder" multiple webkitdirectory directory>
        </label>
        <button class="icon-btn" id="batch-export-json-btn" title="Download batch JSON">⬇️ <span>JSON</span></button>
        <button class="icon-btn" id="batch-export-zip-btn" title="Export approved quizzes">📦 <span>Export</span></button>
      </div>

      <label class="field compact-field">
        <span>AI Provider</span>
        <select id="ai-provider">
          <option value="openai">OpenAI</option>
          <option value="gemini">Gemini</option>
        </select>
      </label>

      <label class="field compact-field">
        <span>API Key</span>
        <input id="api-key" type="password" placeholder="Local server only">
        <small class="field-note">로컬 서버에서만 사용하고 저장하지 않습니다.</small>
      </label>

      <button class="primary-btn compact-primary" id="batch-ai-generate-btn">✨ AI Batch Generate</button>
      <div class="asset-status" id="asset-status">No asset folder loaded.</div>
      <div class="batch-list" id="batch-list"></div>
    </section>

    <section class="story-detail-box">
      <div class="panel-head compact">
        <h2>Selected Story</h2>
      </div>

      <label class="field">
        <span>Story ID</span>
        <input id="story-id" value="OG0000" placeholder="OG0000">
      </label>

      <label class="field">
        <span>Title</span>
        <input id="story-title" placeholder="Story title">
      </label>

      <label class="field">
        <span>Level</span>
        <input id="story-level" value="Level 1">
      </label>

      <label class="field">
        <span>Story Text</span>
        <textarea id="story-text" placeholder="SC01_ST01_N = ..."></textarea>
      </label>

      <button class="secondary-btn" id="generate-ai-btn">✨ AI Generate Selected</button>
    </section>

    <div class="note-box">
      <strong>권장 흐름</strong>
      <p>Batch XLSX와 에셋 폴더를 불러온 뒤 AI Batch Generate로 초안을 만들고, 목록에서 항목을 골라 Preview와 Editor에서 검수합니다.</p>
    </div>
  </aside>

  <section class="panel preview-panel">
    <div class="panel-head">
      <h2>Preview</h2>
      <div class="preview-nav" id="preview-nav"></div>
    </div>
    <div id="preview-stage" class="preview-stage"></div>
  </section>

  <aside class="panel editor-panel">
    <div class="panel-head">
      <h2>Quiz Editor</h2>
      <span class="pill" id="schema-pill">quiz-v3.0</span>
    </div>

    <label class="field">
      <span>Question</span>
      <select id="question-select"></select>
    </label>

    <label class="field">
      <span>Story Grammar</span>
      <select id="sg-select">
        <option value="setting">Setting</option>
        <option value="initiating_event">Initiating Event</option>
        <option value="attempt">Attempt</option>
        <option value="reaction">Reaction</option>
        <option value="internal_response">Internal Response</option>
        <option value="consequence">Consequence</option>
      </select>
    </label>

    <label class="field">
      <span>Question Type</span>
      <select id="type-select">
        <option value="story_sequence_drag">story_sequence_drag</option>
        <option value="setting_slot_drag">setting_slot_drag</option>
        <option value="listen_scene_mcq">listen_scene_mcq</option>
        <option value="scene_word_unscramble">scene_word_unscramble</option>
        <option value="emotion_mcq">emotion_mcq</option>
        <option value="internal_response_mcq">internal_response_mcq</option>
      </select>
    </label>

    <label class="field">
      <span>Instruction</span>
      <input id="instruction-input">
    </label>

    <label class="field">
      <span>Hint</span>
      <input id="hint-input">
    </label>

    <label class="field">
      <span>Resources JSON</span>
      <textarea class="json-area" id="resources-json"></textarea>
    </label>

    <label class="field">
      <span>Interaction JSON</span>
      <textarea class="json-area" id="interaction-json"></textarea>
    </label>

    <label class="field">
      <span>Scoring JSON</span>
      <textarea class="json-area" id="scoring-json"></textarea>
    </label>

    <label class="field">
      <span>Diagnostics JSON</span>
      <textarea class="json-area short" id="diagnostics-json"></textarea>
    </label>

    <button class="primary-btn" id="apply-btn">변경 반영</button>

    <div class="review-box">
      <h3>Batch Review</h3>
      <div class="review-actions">
        <button class="secondary-btn" id="mark-review-btn">Needs Review</button>
        <button class="primary-btn" id="approve-btn">Approve</button>
      </div>
      <div class="issue-list" id="issue-list">Batch 항목을 선택하면 검수 이슈가 표시됩니다.</div>
    </div>

    <div class="export-box">
      <h3>Export</h3>
      <button class="export-btn" id="export-json-btn">Quiz JSON</button>
      <button class="export-btn" id="export-reading-btn">Reading Quiz XLSX</button>
      <button class="export-btn" id="export-dev-btn">Dev Spec XLSX</button>
      <button class="export-btn" id="export-html-btn">Preview HTML</button>
    </div>
  </aside>
</main>

<div id="toast" class="toast" role="status"></div>
<script src="static/studio.js"></script>
</body>
</html>
