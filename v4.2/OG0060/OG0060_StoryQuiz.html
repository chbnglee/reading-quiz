function allScreens(){return [el('cover'),...document.querySelectorAll('.qscreen'),el('student'),el('parent')]}

function updateHint(){const q=QUIZ.questions[current];el('bubble').textContent=q?q.hint:'';el('bookey').classList.remove('open')}
function toggleHint(){el('bookey').classList.toggle('open')}
function toggleDownload(){el('downloadBox').classList.toggle('open')}
function allowDrop(e){e.preventDefault()}

function circled(k){return {A:'ⓐ',B:'ⓑ',C:'ⓒ',D:'ⓓ'}[k]||k.toLowerCase()}
function render(){const wrap=el('screens');wrap.innerHTML='';QUIZ.questions.forEach((q,i)=>{const sec=document.createElement('section');sec.className='screen qscreen';sec.id='q'+i;sec.style.backgroundImage=`linear-gradient(rgba(31,41,55,.24),rgba(31,41,55,.30)),linear-gradient(rgba(255,255,255,.42),rgba(245,243,255,.52)),url("${bg}")`;sec.innerHTML=`<div class="q-card"><div class="q-head"><div class="badge">Q${i+1}</div><div class="instruction">${q.instruction}</div><div class="tag">${sgNames[q.storyGrammar]}</div></div><div id="body${i}"></div><div class="feedback" id="fb${i}"></div><div class="nav-row"><button class="btn btn-retry show" onclick="retry(${i})">Retry</button><button class="btn btn-check" id="check${i}" onclick="check(${i})">Check</button><button class="btn btn-next" id="next${i}" onclick="${i===QUIZ.questions.length-1?'showStudent()':'go('+(i+1)+')'}">${i===QUIZ.questions.length-1?'See Results':'Next'}</button></div></div>`;wrap.appendChild(sec);renderBody(q,i);});updateNav();}
function renderBody(q,i){const b=el('body'+i);if(q.type==='setting_progressive_choice'){const first=q.resources.images[0];b.innerHTML=`<div class="progressive-setting"><div class="scene-grid single-grid"><div class="scene-card image-only"><img src="${img(first.path)}"></div></div><div class="progressive-steps">${q.interaction.steps.map((step,stepIndex)=>{const options=Math.random()<.5?[...step.options]:[...step.options].reverse();return `<div class="progressive-step ${stepIndex?'is-hidden':''}" id="step${i}-${stepIndex}"><div class="progressive-label">${step.label}</div><div class="progressive-options">${options.map(option=>`<button class="progressive-option" data-step="${step.key}" data-choice="${option.key}" onclick="chooseProgressive(${i},${stepIndex},'${option.key}')">${option.text}</button>`).join('')}</div></div>`}).join('')}</div></div>`;answers[i]={};el('check'+i).disabled=true;}else if(q.type==='story_sequence_drag'){b.innerHTML=`<div class="slots seq-slots" id="slots${i}">${q.interaction.correct.map((_,idx)=>`<div class="slot" ondragover="allowDrop(event)" ondrop="dropSeq(event,${i},${idx})" onclick="unplaceSeq(${i},${idx})">Scene ${idx+1}</div>`).join('')}</div><div class="bank seq-bank" id="bank${i}"></div>`;q.resources.images.forEach(r=>addSeqCard(i,r));answers[i]=Array(q.interaction.correct.length).fill(null);}

else if(q.type==='listen_scene_mcq'){b.innerHTML=`<button class="audio-btn" onclick="new Audio('${audio(q.resources.audio.path)}').play()">▶</button><div class="scene-grid event-grid">${q.interaction.options.map(o=>{const r=q.resources.images.find(x=>x.sceneId===o.scene)||q.resources.images[0];return `<div class="scene-card image-only" data-opt="${o.key}" onclick="selectOpt(${i},'${o.key}')"><img src="${img(r.path)}"></div>`}).join('')}</div>`;}
else if(q.type==='scene_word_unscramble'){const first=q.resources.images[0];b.innerHTML=`<div class="scene-grid single-grid"><div class="scene-card image-only"><img src="${img(first.path)}"></div></div><div class="answer-row" id="answer${i}" ondragover="allowDrop(event)" ondrop="dropWord(event,${i})">Drop words here.</div><div class="word-bank" id="bank${i}"></div>`;q.interaction.items.forEach(w=>addWord(i,w));answers[i]=[];}
else{const first=q.resources.images[0];b.innerHTML=`<div class="scene-grid single-grid"><div class="scene-card image-only"><img src="${img(first.path)}"></div></div><div class="option-grid">${q.interaction.options.map(o=>`<button class="option" data-opt="${o.key}" onclick="selectOpt(${i},'${o.key}')"><span class="opt-letter">${circled(o.key)}</span><span>${o.text}</span></button>`).join('')}</div>`;}}
function chooseProgressive(i,stepIndex,key){if(scores[i]!=null)return;const q=QUIZ.questions[i],step=q.interaction.steps[stepIndex];answers[i][step.key]=key;document.querySelectorAll(`#step${i}-${stepIndex} .progressive-option`).forEach(button=>button.classList.toggle('selected',button.dataset.choice===key));const row=el(`step${i}-${stepIndex}`);row.classList.add('complete');const next=el(`step${i}-${stepIndex+1}`);if(next)next.classList.remove('is-hidden');el('check'+i).disabled=!q.interaction.steps.every(item=>answers[i][item.key]);}
function addSeqCard(i,r){const card=document.createElement('div');card.className='scene-card image-only';card.dataset.scene=r.sceneId;card.draggable=true;card.innerHTML=`<img src="${img(r.path)}">`;card.ondragstart=(e)=>dragStart(e,'seq',i,r.sceneId,card);card.onclick=()=>placeSeq(i,r.sceneId);el('bank'+i).appendChild(card)}
function placeSeq(i,scene,pos=null){if(scores[i]!=null)return;const arr=answers[i];if(pos===null)pos=arr.indexOf(null);if(pos<0)return;const old=arr.indexOf(scene);if(old>=0)arr[old]=null;arr[pos]=scene;paintSeq(i)}
function dropSeq(e,i,idx){allowDrop(e);if(dragged&&dragged.kind==='seq'&&dragged.i===i)placeSeq(i,dragged.value,idx);dragged=null}
function unplaceSeq(i,idx){if(scores[i]!=null)return;answers[i][idx]=null;paintSeq(i)}
function paintSeq(i){document.querySelectorAll(`#slots${i} .slot`).forEach((s,idx)=>{const sc=answers[i][idx];s.innerHTML=sc?`<img src="${img(QUIZ.questions[i].resources.images.find(r=>r.sceneId===sc).path)}">`:`Scene ${idx+1}`;s.classList.toggle('filled',!!sc)});document.querySelectorAll(`#bank${i} .scene-card`).forEach(c=>c.style.display=answers[i].includes(c.dataset.scene)?'none':'');}
function addMiniCard(i,item){const c=document.createElement('button');c.className='mini-card';c.textContent=item.text;c.dataset.key=item.key;c.draggable=true;c.ondragstart=(e)=>dragStart(e,'setting',i,item.key,c);c.onclick=()=>{if(scores[i]!=null)return;selected=item.key;document.querySelectorAll(`#bank${i} .mini-card`).forEach(x=>x.classList.remove('selected'));c.classList.add('selected')};el('bank'+i).appendChild(c)}
function placeSetting(i,slot){if(scores[i]!=null||!selected)return;const prev=answers[i][slot];if(prev){const old=document.querySelector(`#bank${i} .mini-card[data-key="${prev}"]`);if(old)old.style.display='';}answers[i][slot]=selected;const s=document.querySelector(`#body${i} .slot[data-slot="${slot}"]`);const item=QUIZ.questions[i].interaction.items.find(x=>x.key===selected);s.textContent=item.text;s.classList.add('filled');const used=document.querySelector(`#bank${i} .mini-card[data-key="${selected}"]`);if(used)used.style.display='none';selected=null;document.querySelectorAll(`#bank${i} .mini-card`).forEach(x=>x.classList.remove('selected'))}
function dropSetting(e,i,slot){allowDrop(e);if(dragged&&dragged.kind==='setting'&&dragged.i===i){selected=dragged.value;placeSetting(i,slot)}dragged=null}
function addWord(i,w){const c=document.createElement('button');c.className='word';c.textContent=w;c.draggable=true;c.ondragstart=(e)=>dragStart(e,'word',i,w,c);c.onclick=()=>addWordAnswer(i,w,c);el('bank'+i).appendChild(c)}
function addWordAnswer(i,w,source=null){if(scores[i]!=null)return;answers[i].push(w);if(source)source.style.display='none';else{const btn=[...document.querySelectorAll(`#bank${i} .word`)].find(x=>x.textContent===w&&x.style.display!=='none');if(btn)btn.style.display='none';}paintWords(i)}
function dropWord(e,i){allowDrop(e);if(dragged&&dragged.kind==='word'&&dragged.i===i)addWordAnswer(i,dragged.value);dragged=null}
function removeWord(i,idx,w){if(scores[i]!=null)return;answers[i].splice(idx,1);const btn=[...document.querySelectorAll(`#bank${i} .word`)].find(x=>x.textContent===w&&x.style.display==='none');if(btn)btn.style.display='';paintWords(i)}
function paintWords(i){const a=el('answer'+i);a.innerHTML=answers[i].length?answers[i].map((w,idx)=>`<button class="word" onclick="removeWord(${i},${idx},'${w.replace(/'/g,"\\\\'")}')">${w}</button>`).join(''):'Drop words here.'}
function selectOpt(i,key){if(scores[i]!=null)return;answers[i]=key;document.querySelectorAll(`#body${i} [data-opt]`).forEach(o=>o.classList.toggle('selected',o.dataset.opt===key))}
function lockQuestion(i){document.querySelectorAll(`#body${i} button,#body${i} .scene-card,#body${i} .slot`).forEach(n=>{n.disabled=true;n.draggable=false;n.style.pointerEvents='none'})}
function lcsLength(a,b){const dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let x=1;x<=a.length;x++){for(let y=1;y<=b.length;y++){dp[x][y]=a[x-1]===b[y-1]?dp[x-1][y-1]+1:Math.max(dp[x-1][y],dp[x][y-1])}}return dp[a.length][b.length]}
function rubricRow(q,score){return (q.responseRubric||[]).find(r=>Number(r.score)===Number(score))||null}
function scoreOrdered(submitted,correct){const clean=(submitted||[]).filter(x=>x!=null),n=correct.length,lcs=lcsLength(clean,correct),ratio=n?lcs/n:0;const score=lcs===n&&clean.length===n?100:ratio>=.75?67:ratio>=.40?33:0;return {score,evidenceRaw:Math.round(ratio*100),lcs,itemCount:n}}
function check(i){if(scores[i]!=null)return;const q=QUIZ.questions[i];let score=0,evidenceRaw=0,detail={};if(q.type==='setting_progressive_choice'){const exact=q.scoring.components.filter(c=>answers[i][c.key]===c.correctValue).length,total=q.scoring.components.length;score=exact===total?100:exact===2?67:exact===1?33:0;evidenceRaw=Math.round(exact/total*100);detail={score,evidenceRaw,exact,total,choices:{...answers[i]}};document.querySelectorAll(`#body${i} .progressive-option`).forEach(button=>{const step=q.interaction.steps.find(item=>item.key===button.dataset.step);if(button.dataset.choice===step.correct)button.classList.add('correct');else if(answers[i][step.key]===button.dataset.choice)button.classList.add('wrong')});}else if(q.type==='story_sequence_drag'){const result=scoreOrdered(answers[i],q.interaction.correct);score=result.score;evidenceRaw=result.evidenceRaw;detail={...result,order:[...answers[i]]};}
else if(q.type==='setting_slot_drag'){const exact=q.scoring.components.filter(c=>answers[i][c.key]===c.correctValue).length,total=q.scoring.components.length;score=exact===total?100:exact===2?67:exact===1?33:0;evidenceRaw=Math.round(exact/total*100);detail={score,evidenceRaw,exact,total,slots:{...answers[i]}};}
else if(q.type==='scene_word_unscramble'){const result=scoreOrdered(answers[i],q.interaction.correct);score=result.score;evidenceRaw=result.evidenceRaw;document.querySelectorAll(`#answer${i} .word`).forEach((n,idx)=>{n.classList.add(answers[i][idx]===q.interaction.correct[idx]?'correct':'wrong')});detail={...result,words:[...answers[i]]};}
else{const o=q.interaction.options.find(x=>x.key===answers[i]);score=o?Number(o.score):0;evidenceRaw=score;document.querySelectorAll(`#body${i} [data-opt]`).forEach(n=>{const opt=q.interaction.options.find(x=>x.key===n.dataset.opt);if(opt&&opt.isCorrect)n.classList.add('correct');else if(n.dataset.opt===answers[i])n.classList.add('wrong');});detail={score,evidenceRaw,selected:answers[i],selectedOption:o||null};}
const row=rubricRow(q,score);answerDetails[i]={...detail,responseQuality:row?row.responseQuality:'Unrelated',misconceptionType:row?row.misconceptionType:'no_response',skillTags:(q.assessmentMetadata||{}).skillTags||[],recommendedAction:row?row.recommendedActionKo:''};scores[i]=score;lockQuestion(i);const fb=el('fb'+i);fb.className='feedback show '+(score>=67?'ok':'no');fb.textContent=row?(row.studentFeedbackEn||row.labelEn):'Let’s try together!';el('next'+i).classList.add('show');updateNav();}
function retry(i){scores[i]=null;answers[i]=null;answerDetails[i]=null;renderBody(QUIZ.questions[i],i);el('fb'+i).className='feedback';el('next'+i).classList.remove('show');updateNav()}
function averageScore(){return Math.round(scores.reduce((sum,v)=>sum+(v??0),0)/scores.length)}
function overallBand(){const avg=averageScore();return (QUIZ.reporting.masteryBands||[]).find(b=>avg>=b.min&&avg<=b.max)||QUIZ.reporting.masteryBands.at(-1)}
function childResult(){const strong=scores.filter(v=>v>=67).length;if(strong===scores.length)return 'Ready for the next story!';if(strong>=2)return 'One more look!';return 'Let’s look again together!'}
function showStudent(){allScreens().forEach(s=>s.classList.remove('active'));el('student').classList.add('active');el('bookey').classList.remove('show');el('studentSummary').textContent=childResult();el('oxGrid').innerHTML=QUIZ.questions.map((q,i)=>{const row=rubricRow(q,scores[i]??0);return `<div class="ox ${scores[i]>=67?'ok':'no'}"><strong>${sgNames[q.storyGrammar]}</strong><br><small>${row?(row.studentFeedbackEn||row.labelEn):''}</small></div>`}).join('')}
function sgScores(){const out={};QUIZ.questions.forEach((q,i)=>out[q.storyGrammar]=scores[i]??0);return out}
function parentComment(q,i){const score=scores[i]??0,detail=answerDetails[i]||{},row=rubricRow(q,score);let selected='';if(detail.selectedOption&&!detail.selectedOption.isCorrect&&detail.selectedOption.diagnostic)selected=` 선택 오답 진단: ${detail.selectedOption.diagnostic}`;return row?`${row.parentFeedbackKo}${selected}`:`${sgNames[q.storyGrammar]} 영역에서 추가 확인이 필요합니다.`}
function overallParentComment(){const weakest=scores.reduce((best,v,i)=>v<(scores[best]??101)?i:best,0),q=QUIZ.questions[weakest],row=rubricRow(q,scores[weakest]??0);return `<div class="score-card" style="grid-column:1/-1"><strong>이번 이야기 결과</strong><p><b>확인한 영역:</b> Setting · Key Situation · Key Action · Story Sequence<br><b>우선 연습:</b> ${sgNames[q.storyGrammar]}<br><b>다음 활동:</b> ${row?row.recommendedActionKo:'핵심 장면을 다시 읽고 재시도합니다.'}</p></div>`}
function showParent(){allScreens().forEach(s=>s.classList.remove('active'));el('parent').classList.add('active');el('scoreList').innerHTML=overallParentComment()+QUIZ.questions.map((q,i)=>{const row=rubricRow(q,scores[i]??0);return `<div class="score-card"><strong>Q${i+1} · ${sgNames[q.storyGrammar]}</strong><div class="quality">${row?row.labelKo:'추가 확인 필요'}</div><p>${parentComment(q,i)}</p></div>`}).join('')}
function drawRadar(s){const c=el('radar'),ctx=c.getContext('2d'),cx=180,cy=150,r=105;ctx.clearRect(0,0,360,300);ctx.strokeStyle='#DDD6FE';ctx.fillStyle='#7C3AED';ctx.font='12px Arial';for(let level=1;level<=4;level++){ctx.beginPath();sgOrder.forEach((k,i)=>{const a=-Math.PI/2+i*Math.PI*2/sgOrder.length;const rr=r*level/4;const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.stroke();}ctx.beginPath();sgOrder.forEach((k,i)=>{const a=-Math.PI/2+i*Math.PI*2/sgOrder.length;const rr=r*((s[k]??0)/100);const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle='rgba(124,58,237,.35)';ctx.fill();ctx.strokeStyle='#7C3AED';ctx.stroke();sgOrder.forEach((k,i)=>{const a=-Math.PI/2+i*Math.PI*2/sgOrder.length;ctx.fillStyle='#374151';ctx.fillText(k.split('_')[0],cx+Math.cos(a)*(r+28)-24,cy+Math.sin(a)*(r+28)+4)})}
function restart(){scores.fill(null);answers.fill(null);answerDetails.fill(null);allScreens().forEach(s=>s.classList.remove('active'));el('cover').classList.add('active');updateNav()}
render();
</script>
